<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Want Sell On World</title>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>🌍 Want Sell On World</h1>
      <button id="loginBtn">Connect Wallet</button>
    </header>

    <!-- Action Bar: Post Ad & View My Ads -->
    <div class="action-bar" style="display:flex; gap:10px;">
      <button id="openModalBtn" class="btn-success" style="display:none; flex:1;">+ Sell Item (1 WLD)</button>
      <button id="viewMyAdsBtn" class="btn-primary" style="display:none;">📦 My Ads</button>
    </div>

    <!-- Filters Bar: Country Selection -->
    <div class="filter-bar" style="margin-bottom: 15px;">
      <select id="countryFilter" class="glass-select">
        <option value="ALL">🌐 All Countries (Global)</option>
        <option value="IN">🇮🇳 India</option>
        <option value="US">🇺🇸 United States</option>
        <option value="AE">🇦🇪 UAE</option>
        <option value="GB">🇬🇧 United Kingdom</option>
        <option value="SG">🇸🇬 Singapore</option>
      </select>
    </div>

    <!-- Product Feed -->
    <main class="feed-section">
      <h2>Explore Marketplace</h2>
      <div id="listingsContainer" class="listings-grid">
        <p class="loading-text">Loading marketplace items...</p>
      </div>
    </main>

    <!-- Modal for Posting Ad -->
    <div id="adModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span id="closeModalBtn" class="close">&times;</span>
        <h2>Post New Ad (1 WLD)</h2>
        <form id="adForm">
          <input type="text" id="title" placeholder="Product Title (e.g. iPhone 13)" required>
          <textarea id="description" placeholder="Description details..." required></textarea>
          <input type="number" id="price" placeholder="Price in WLD" required>
          <input type="text" id="category" placeholder="Category (Electronics, Fashion...)" required>
          <select id="adCountry" class="glass-select" required style="width:100%; padding:12px; border-radius:10px; background:#222; color:#fff; border:1px solid rgba(255,255,255,0.1);">
            <option value="IN">🇮🇳 India</option>
            <option value="US">🇺🇸 United States</option>
            <option value="AE">🇦🇪 UAE</option>
            <option value="GB">🇬🇧 United Kingdom</option>
            <option value="SG">🇸🇬 Singapore</option>
          </select>
          <input type="text" id="imageUrl" placeholder="Image URL" required>
          <button type="submit" class="btn-pay">Pay 1 WLD & Post Ad</button>
        </form>
      </div>
    </div>

    <!-- Modal for My Ads -->
    <div id="myAdsModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span id="closeMyAdsModal" class="close">&times;</span>
        <h2>My Posted Ads</h2>
        <div id="myAdsContainer" style="max-height: 350px; overflow-y: auto; margin-top: 10px;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
