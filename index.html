<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Want Sell On World</title>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>🌍 Want Sell On World</h1>
      <button id="loginBtn">Connect Wallet</button>
    </header>

    <div class="action-bar" style="display:flex; gap:10px;">
      <button id="viewMyAdsBtn" class="btn-primary" style="display:none; width: 100%;">📦 My Ads (Manage & Sold Out)</button>
    </div>

    <button type="button" onclick="document.getElementById('adModal').style.display='flex'" class="btn-success" style="width:100%; padding:16px; font-size:1rem; font-weight:700; border-radius:16px; margin-bottom:18px; cursor:pointer;">
      ✨ Post an Ad & Sell (0.1 WLD)
    </button>

    <div class="filter-box" style="background:rgba(255,255,255,0.85); border:1px solid var(--border-color); padding:12px; border-radius:14px; margin-bottom: 15px; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:8px;">
        <select id="countryFilter" class="glass-select" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">🌐 All Countries</option>
          <option value="IN">🇮🇳 India</option>
          <option value="US">🇺🇸 United States</option>
          <option value="AE">🇦🇪 UAE</option>
          <option value="GB">🇬🇧 United Kingdom</option>
          <option value="SG">🇸🇬 Singapore</option>
        </select>

        <select id="categoryFilter" class="glass-select" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">📂 All Categories</option>
          <option value="Electronics">🔌 Electronics</option>
          <option value="Phones">📱 Phones</option>
          <option value="Laptops">💻 Laptops</option>
          <option value="Games">🎮 Games</option>
          <option value="Clothes">👕 Clothes</option>
          <option value="Shoes">👟 Shoes</option>
          <option value="Bags">🎒 Bags</option>
          <option value="Home Appliances">🏠 Appliances</option>
          <option value="Books & Sports">⚽ Sports/Books</option>
          <option value="Automotive">🚗 Automotive</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>

      <input type="text" id="searchInput" placeholder="🔍 Search ads..." style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">

      <div style="display:flex; flex-direction:column; gap:4px; margin-top:4px;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#64748b;">
          <span>Radius Range:</span>
          <span id="rangeValue" style="color:#10b981; font-weight:bold;">50 km</span>
        </div>
        <input type="range" id="distanceRange" min="5" max="500" value="50" step="5" style="width:100%; cursor:pointer;">
      </div>
    </div>

    <main class="feed-section">
      <h2>Explore Marketplace</h2>
      <div id="listingsContainer" class="listings-grid">
        <p class="loading-text">Loading marketplace items...</p>
      </div>
    </main>

    <!-- Post Ad Modal -->
    <div id="adModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('adModal').style.display='none'">&times;</span>
        <h2>Post New Ad</h2>
        <p style="font-size: 11px; color: #ef4444; margin-bottom: 8px; font-weight: 600;">⚠️ Note: Ads will be pinned to your current real-time GPS location.</p>
        <form id="adForm">
          <input type="text" id="title" placeholder="Product Title" required>
          <select id="category" required>
            <option value="" disabled selected>Select Category</option>
            <option value="Electronics">Electronics</option>
            <option value="Phones">Phones</option>
            <option value="Laptops">Laptops</option>
            <option value="Games">Games</option>
            <option value="Clothes">Clothes</option>
            <option value="Shoes">Shoes</option>
            <option value="Bags">Bags</option>
            <option value="Home Appliances">Home Appliances</option>
            <option value="Books & Sports">Books & Sports</option>
            <option value="Automotive">Automotive</option>
            <option value="Other">Other</option>
          </select>
          
          <select id="adCountry" required>
            <option value="" disabled selected>Select Country / Region</option>
            <option value="ALL">🌐 All Countries / Other</option>
            <option value="IN">🇮🇳 India</option>
            <option value="US">🇺🇸 United States</option>
            <option value="AE">🇦🇪 UAE</option>
            <option value="GB">🇬🇧 United Kingdom</option>
            <option value="SG">🇸🇬 Singapore</option>
          </select>

          <div style="display:flex; gap:6px;">
            <input type="text" id="adAddress" placeholder="Click detect to auto-fill address & GPS" required style="flex:1;" readonly>
            <button type="button" onclick="window.detectLocation()" style="background:#10b981; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">📍 Detect GPS</button>
          </div>

          <textarea id="description" placeholder="Description (No Phone Numbers)" required style="resize:none; height:60px;"></textarea>
          <input type="number" id="price" placeholder="Price in WLD" required>
          <input type="file" id="imageInput" multiple accept="image/*" required style="padding: 6px; border: 1px solid #cbd5e1; border-radius: 8px;">
          <button type="submit" class="btn-pay">Post Now (0.1 WLD)</button>
        </form>
      </div>
    </div>

    <!-- Ad Details Modal -->
    <div id="adDetailsModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:500px;">
        <span class="close" onclick="document.getElementById('adDetailsModal').style.display='none'">&times;</span>
        <div id="adDetailsBody"></div>
      </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:400px;">
        <span class="close" onclick="document.getElementById('chatModal').style.display='none'">&times;</span>
        <h3 id="chatTitle">Chat with Seller</h3>
        <div id="chatMessages" style="height:200px; border:1px solid #cbd5e1; border-radius:8px; padding:10px; overflow-y:auto; margin:10px 0; background:#f8fafc; display:flex; flex-direction:column; gap:6px;"></div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="chatInput" placeholder="Type a message..." style="flex:1; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
          <button onclick="window.sendMessage()" style="background:#4f46e5; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Send</button>
        </div>
      </div>
    </div>

    <!-- My Ads Modal -->
    <div id="myAdsModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('myAdsModal').style.display='none'">&times;</span>
        <h2>My Posted Ads</h2>
        <div id="myAdsContainer" style="max-height: 350px; overflow-y: auto; margin-top: 10px;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
