<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Want Sell On World</title>
  <style>
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes iconBounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } }
    .slider-btn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 2rem; cursor: pointer; padding: 15px 20px; border-radius: 12px; backdrop-filter: blur(5px); transition: 0.3s; }
  </style>
</head>
<body style="margin: 0; padding: 0; background: #f8fafc;">

  <div class="app-container" style="padding-top: 10px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; width: 100%; box-sizing: border-box;">
      <a href="mailto:airdrophubgroup@gmail.com" style="background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">🎧 Support</a>
      
      <!-- Admin Button -->
      <button id="adminPanelBtn" onclick="window.openAdminPanel()" style="display:none; background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;">🛡️ Admin</button>

      <div style="font-size: 11px; color: #64748b; font-weight: 600; background: rgba(0, 0, 0, 0.04); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05);">🌍 Worldcoin Marketplace</div>
    </div>

    <header class="header">
      <h1>🌍 Want Sell On World</h1>
      <button id="loginBtn">Connect Wallet</button>
    </header>

    <div class="action-bar" style="display:flex; gap:10px; margin-bottom: 12px;">
      <button onclick="window.openLeaderboard()" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);">🏆</button>
      <button id="viewMyAdsBtn" class="btn-primary" style="display:none; width: 100%;">📦 My Ads & Balance</button>
    </div>

    <button type="button" onclick="document.getElementById('adModal').style.display='flex'" class="btn-success" style="width:100%; padding:16px; font-size:1rem; font-weight:700; border-radius:16px; margin-bottom:18px; cursor:pointer;">
      ✨ Post an Ad & Sell (1 WLD)
    </button>

    <div class="filter-box" style="background:rgba(255,255,255,0.85); border:1px solid #e2e8f0; padding:12px; border-radius:14px; margin-bottom: 15px; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:8px;">
        <select id="countryFilter" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">🌐 All Countries</option>
          <option value="IN">🇮🇳 India</option>
        </select>
        <select id="categoryFilter" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">📂 All Categories</option>
          <option value="Electronics">🔌 Electronics</option>
          <option value="Phones">📱 Phones</option>
          <option value="Laptops">💻 Laptops</option>
        </select>
      </div>
      <input type="text" id="searchInput" placeholder="🔍 Search ads..." style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">
      <input type="range" id="distanceRange" min="5" max="500" value="50" style="width:100%;">
    </div>

    <main class="feed-section">
      <h2>Explore Marketplace</h2>
      <div id="listingsContainer" class="listings-grid"></div>
    </main>

    <!-- Post Ad Modal -->
    <div id="adModal" class="modal" style="display:none; z-index: 1000;">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('adModal').style.display='none'">&times;</span>
        <h2>Post New Ad (1 WLD)</h2>
        <form id="adForm">
          <input type="text" id="title" placeholder="Product Title" required>
          <select id="category" required>
            <option value="Electronics">🔌 Electronics</option>
            <option value="Phones">📱 Phones</option>
            <option value="Laptops">💻 Laptops</option>
          </select>
          <select id="adCountry" required><option value="IN">🇮🇳 India</option></select>
          <div style="display:flex; gap:6px;">
            <input type="text" id="adAddress" placeholder="Detect GPS location" required style="flex:1;" readonly>
            <button type="button" onclick="window.detectLocation()" style="background:#10b981; color:#fff; border:none; padding:8px; border-radius:8px;">📍</button>
          </div>
          <textarea id="description" placeholder="Description" required style="resize:none; height:60px;"></textarea>
          <input type="number" id="price" placeholder="Price in WLD" required>
          <input type="file" id="imageInput" multiple accept="image/*" required>
          <button type="submit" class="btn-pay" style="width:100%;">Post Now (1 WLD)</button>
        </form>
      </div>
    </div>

    <!-- Admin/Reviews/Chat Modals -->
    <div id="adminModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('adminModal').style.display='none'">&times;</span><h2>🛡️ Admin</h2><div id="adminStatsContainer"></div><div id="adminListingsContainer"></div></div></div>
    <div id="reviewsModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('reviewsModal').style.display='none'">&times;</span><h3 id="reviewsModalTitle">Ratings</h3><div id="reviewsListContainer"></div><select id="reviewRating"><option value="5">⭐⭐⭐⭐⭐</option></select><input type="text" id="reviewComment"><button onclick="window.submitReview()">Post</button></div></div>
    <div id="chatModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('chatModal').style.display='none'">&times;</span><h3 id="chatTitle">Chat</h3><div id="chatMessages" style="height:300px; overflow-y:auto;"></div><input type="text" id="chatInput"><button onclick="window.sendMessage()">Send</button></div></div>
    
    <!-- Neon Popup -->
    <div id="neonPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; align-items:center; justify-content:center; background:rgba(0,0,0,0.8);">
      <div id="neonPopupBox" style="background:#0f172a; border:2px solid #38bdf8; padding:30px; text-align:center; border-radius:20px;">
        <div id="neonPopupIcon" style="font-size:50px;">🔔</div>
        <h2 id="neonPopupTitle">Notice</h2>
        <p id="neonPopupText"></p>
        <div id="neonPopupAlertBtnContainer"><button id="neonPopupAlertBtn">OK</button></div>
      </div>
    </div>
    
    <div id="adDetailsModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('adDetailsModal').style.display='none'">&times;</span><div id="adDetailsBody"></div></div></div>
    <div id="imageViewerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:20000; background:rgba(0,0,0,0.95); flex-direction:column; align-items:center; justify-content:center;">
      <button onclick="document.getElementById('imageViewerModal').style.display='none'" style="position:absolute; top:20px; left:20px;">⬅️</button>
      <img id="viewerImage" src="" style="max-width:80%; max-height:70vh;">
      <div id="imageCounter">1 / 1</div>
    </div>
    <div id="myAdsModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('myAdsModal').style.display='none'">&times;</span><h2>My Ads</h2><div id="myAdsContainer"></div></div></div>
    <div id="leaderboardModal" class="modal" style="display:none; z-index: 1000;"><div class="modal-content"><span class="close" onclick="document.getElementById('leaderboardModal').style.display='none'">&times;</span><h2>🏆 Leaderboard</h2><div id="leaderboardContainer"></div></div></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
