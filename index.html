<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Want Sell On World</title>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>🌍 Want Sell On World</h1>
      <button id="loginBtn">Connect Wallet</button>
    </header>

    <div class="action-bar" style="display:flex; gap:10px;">
      <button id="viewMyAdsBtn" class="btn-primary" style="display:none; width: 100%;">📦 My Ads</button>
    </div>

    <button type="button" onclick="document.getElementById('adModal').style.display='flex'" class="btn-success" style="width:100%; padding:16px; font-size:1rem; font-weight:700; border-radius:16px; margin-bottom:18px; cursor:pointer;">
      ✨ Post an Ad & Sell (0.1 WLD)
    </button>

    <div class="filter-box" style="background:rgba(255,255,255,0.85); border:1px solid var(--border-color); padding:12px; border-radius:14px; margin-bottom: 15px;">
      <div style="display:flex; gap:8px;">
        <select id="countryFilter" class="glass-select" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">🌐 All Countries</option>
          <option value="IN">🇮🇳 India</option>
          <option value="US">🇺🇸 United States</option>
        </select>
        <select id="categoryFilter" class="glass-select" style="flex:1; padding:8px; border-radius:8px;">
          <option value="ALL">📂 All Categories</option>
          <option value="Electronics">🔌 Electronics</option>
          <option value="Phones">📱 Phones</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <input type="range" id="distanceRange" min="5" max="500" value="50" step="5" style="width:100%; margin-top:10px;">
    </div>

    <main class="feed-section">
      <div id="listingsContainer" class="listings-grid"></div>
    </main>

    <div id="adModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('adModal').style.display='none'">&times;</span>
        <h2>Post New Ad</h2>
        <form id="adForm">
          <input type="text" id="title" placeholder="Product Title" required>
          <select id="category" required>
            <option value="Electronics">Electronics</option>
            <option value="Phones">Phones</option>
            <option value="Other">Other</option>
          </select>
          <select id="adCountry" required>
            <option value="IN">India</option>
            <option value="US">United States</option>
          </select>
          <textarea id="description" placeholder="Description" required></textarea>
          <input type="number" id="price" placeholder="Price in WLD" required>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="text" id="img1" placeholder="Image 1 URL" required>
            <input type="text" id="img2" placeholder="Image 2 URL" required>
            <input type="text" id="img3" placeholder="Image 3 URL" required>
            <input type="text" id="img4" placeholder="Image 4 URL" required>
          </div>
          <button type="submit" class="btn-pay">Post Now (0.1 WLD)</button>
        </form>
      </div>
    </div>

    <div id="myAdsModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('myAdsModal').style.display='none'">&times;</span>
        <h2>My Ads</h2>
        <div id="myAdsContainer"></div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
